<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenedor Productos - Level-Up Gamer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .sidebar { min-height: 100vh; background-color: #111111; border-right: 2px solid #1E90FF; }
    .sidebar a { color: #D3D3D3; text-decoration: none; padding: 12px 20px; display: block; }
    .sidebar a:hover, .sidebar a.active { background-color: #1E90FF; color: #FFFFFF; font-weight: bold; }
  </style>
</head>
<body class="bg-black text-white">

  <div class="d-flex">
    <!-- Sidebar -->
    <aside class="sidebar col-md-3 col-lg-2 p-0">
      <div class="p-3 text-center border-bottom border-secondary">
        <h4 class="text-neon m-0" style="font-family: 'Orbitron', sans-serif;">LEVEL-UP</h4>
        <small class="text-muted">ADMINISTRACIÓN</small>
      </div>
      <nav class="mt-3">
        <a href="index.html">📊 Dashboard</a>
        <a href="productos.html" class="active">🎮 Mantenedor Productos</a>
        <a href="usuarios.html">👥 Mantenedor Usuarios</a>
        <a href="../index.html" class="mt-5 border-top border-secondary text-danger">🚪 Volver a la Tienda</a>
      </nav>
    </aside>

    <main class="col-md-9 col-lg-10 p-4">
      <h2 class="text-neon mb-4" style="font-family: 'Orbitron', sans-serif;">Gestión de Productos</h2>

      <!-- Formulario Agregar/Editar Producto -->
      <section class="p-4 rounded border border-secondary mb-5" style="background-color: #111111;">
        <h4 class="text-white mb-3">Nuevo Producto</h4>
        <form id="productoForm" novalidate>
          <div class="row g-3">
            <div class="col-md-4">
              <label for="prodCodigo" class="form-label">Código Producto (*):</label>
              <input type="text" class="form-control" id="prodCodigo" placeholder="Ej: JM001" required>
              <small class="text-muted">Mínimo 3 caracteres.</small>
            </div>
            <div class="col-md-8">
              <label for="prodNombre" class="form-label">Nombre Producto (*):</label>
              <input type="text" class="form-control" id="prodNombre" maxlength="100" placeholder="Ej: Catan" required>
            </div>
            <div class="col-md-4">
              <label for="prodPrecio" class="form-label">Precio CLP (*):</label>
              <input type="number" class="form-control" id="prodPrecio" min="0" step="any" placeholder="Ej: 29990" required>
            </div>
            <div class="col-md-4">
              <label for="prodStock" class="form-label">Stock Actual (*):</label>
              <input type="number" class="form-control" id="prodStock" min="0" step="1" placeholder="Ej: 15" required>
            </div>
            <div class="col-md-4">
              <label for="prodStockCritico" class="form-label">Stock Crítico (Opcional):</label>
              <input type="number" class="form-control" id="prodStockCritico" min="0" step="1" placeholder="Ej: 3">
            </div>
            <div class="col-md-6">
              <label for="prodCategoria" class="form-label">Categoría (*):</label>
              <select class="form-select form-control" id="prodCategoria" required>
                <option value="">-- Selecciona Categoría --</option>
                <option value="Juegos de Mesa">Juegos de Mesa</option>
                <option value="Accesorios">Accesorios</option>
                <option value="Consolas">Consolas</option>
                <option value="Computadores Gamers">Computadores Gamers</option>
                <option value="Sillas Gamers">Sillas Gamers</option>
                <option value="Mouse">Mouse</option>
                <option value="Mousepad">Mousepad</option>
                <option value="Poleras Personalizadas">Poleras Personalizadas</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="prodImagen" class="form-label">URL Imagen (Opcional):</label>
              <input type="text" class="form-control" id="prodImagen" placeholder="assets/img/producto.jpg">
            </div>
            <div class="col-12">
              <label for="prodDescripcion" class="form-label">Descripción (Opcional):</label>
              <textarea class="form-control" id="prodDescripcion" rows="2" maxlength="500" placeholder="Descripción detallada..."></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-neon mt-4 px-4">Guardar Producto</button>
        </form>
      </section>

      <!-- Tabla Listado de Productos -->
      <section class="table-responsive">
        <h4 class="text-white mb-3">Listado de Inventario</h4>
        <table class="table table-dark table-hover border-secondary">
          <thead>
            <tr>
              <th>Código</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Estado Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProductosAdmin">
            <!-- Cargado por JS -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="admin-productos.js"></script>
</body>
</html>
