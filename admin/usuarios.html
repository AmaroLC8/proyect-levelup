<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenedor Usuarios - Level-Up Gamer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .sidebar { min-height: 100vh; background-color: #111111; border-right: 2px solid #1E90FF; }
    .sidebar a { color: #D3D3D3; text-decoration: none; padding: 12px 20px; display: block; }
    .sidebar a:hover, .sidebar a.active { background-color: #1E90FF; color: #FFFFFF; font-weight: bold; }
  </style>
</head>
<body class="bg-black text-white">

  <div class="d-flex">
    <!-- Sidebar -->
    <aside class="sidebar col-md-3 col-lg-2 p-0">
      <div class="p-3 text-center border-bottom border-secondary">
        <h4 class="text-neon m-0" style="font-family: 'Orbitron', sans-serif;">LEVEL-UP</h4>
        <small class="text-muted">ADMINISTRACIÓN</small>
      </div>
      <nav class="mt-3">
        <a href="index.html">📊 Dashboard</a>
        <a href="productos.html">🎮 Mantenedor Productos</a>
        <a href="usuarios.html" class="active">👥 Mantenedor Usuarios</a>
        <a href="../index.html" class="mt-5 border-top border-secondary text-danger">🚪 Volver a la Tienda</a>
      </nav>
    </aside>

    <main class="col-md-9 col-lg-10 p-4">
      <h2 class="text-neon mb-4" style="font-family: 'Orbitron', sans-serif;">Gestión de Usuarios</h2>

      <!-- Formulario Crear/Editar Usuario -->
      <section class="p-4 rounded border border-secondary mb-5" style="background-color: #111111;">
        <h4 class="text-white mb-3">Nuevo Usuario</h4>
        <form id="usuarioForm" novalidate>
          <div class="row g-3">
            <div class="col-md-4">
              <label for="usrRun" class="form-label">RUN (* sin puntos ni guion):</label>
              <input type="text" class="form-control" id="usrRun" placeholder="Ej: 19011022K" maxlength="9" required>
            </div>
            <div class="col-md-4">
              <label for="usrNombre" class="form-label">Nombre (*):</label>
              <input type="text" class="form-control" id="usrNombre" maxlength="50" required>
            </div>
            <div class="col-md-4">
              <label for="usrApellidos" class="form-label">Apellidos (*):</label>
              <input type="text" class="form-control" id="usrApellidos" maxlength="100" required>
            </div>
            <div class="col-md-6">
              <label for="usrEmail" class="form-label">Correo Electrónico (*):</label>
              <input type="email" class="form-control" id="usrEmail" placeholder="ejemplo@duoc.cl" maxlength="100" required>
            </div>
            <div class="col-md-6">
              <label for="usrTipo" class="form-label">Tipo de Usuario / Rol (*):</label>
              <select class="form-select form-control" id="usrTipo" required>
                <option value="">-- Selecciona Rol --</option>
                <option value="Administrador">Administrador</option>
                <option value="Cliente">Cliente</option>
                <option value="Vendedor">Vendedor</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="usrRegion" class="form-label">Región (*):</label>
              <select class="form-select form-control" id="usrRegion" required>
                <option value="">-- Selecciona Región --</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="usrComuna" class="form-label">Comuna (*):</label>
              <select class="form-select form-control" id="usrComuna" required disabled>
                <option value="">-- Selecciona Comuna --</option>
              </select>
            </div>
            <div class="col-12">
              <label for="usrDireccion" class="form-label">Dirección (*):</label>
              <input type="text" class="form-control" id="usrDireccion" maxlength="300" placeholder="Calle, número, depto/casa" required>
            </div>
          </div>
          <button type="submit" class="btn btn-neon mt-4 px-4">Guardar Usuario</button>
        </form>
      </section>

      <!-- Tabla Listado de Usuarios -->
      <section class="table-responsive">
        <h4 class="text-white mb-3">Listado de Usuarios Registrados</h4>
        <table class="table table-dark table-hover border-secondary">
          <thead>
            <tr>
              <th>RUN</th>
              <th>Nombre Completo</th>
              <th>Correo</th>
              <th>Tipo de Usuario</th>
              <th>Comuna</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaUsuariosAdmin">
            <!-- Cargado por JS -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="admin-usuarios.js"></script>
</body>
</html>
