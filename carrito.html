    <header>
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1E90FF;">
            <div class="container">
                <a class="navbar-brand text-white fw-bold" href="index.html" style="font-family: 'Orbitron', sans-serif;">
                    LEVEL-UP <span style="color: #39FF14;">GAMER</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link text-white" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="catalogo.html">Catálogo</a></li>

    </header>

    <main class="container my-5">
        <h2 class="text-center text-neon mb-5">Tu Carrito de Compras</h2>

        <section class="table-responsive">
            <table class="table table-dark table-hover border-secondary">
                <thead>
                    <tr>
                        <th scope="col">Producto</th>
                        <th scope="col">Cantidad</th>
                        <th scope="col">Precio Unitario</th>
                        <th scope="col">Subtotal</th>
                        <th scope="col">Acción</th>
                    </tr>
                </thead>
                
                <tbody id="tablaCarrito"></tbody>
                
                <tfoot id="tfootCarrito"></tfoot>
            </table>
        </section>

        <div class="text-end mt-4">
            <button class="btn btn-outline-danger me-2" onclick="vaciarCarrito()">Vaciar Carrito</button>
            <button class="btn btn-neon">Proceder al Pago</button>
        </div>
    </main>

  
    <footer class="text-center py-4 mt-auto" style="background-color: #000000; border-top: 1px solid #333;">
        <div class="container">
            <p class="mb-1">Equipo de Desarrollo Fullstack II - 2026</p>
            <p class="text-muted small">Apoyando a la comunidad gamer nacional.</p>
