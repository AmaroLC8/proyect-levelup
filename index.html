<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Level-Up Gamer</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-black text-white">

    <header>
        
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1E90FF;">
            <div class="container">
                <a class="navbar-brand text-white fw-bold" href="#" style="font-family: 'Orbitron', sans-serif;">LEVEL-UP GAMER</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link text-white" href="#">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="catalogo.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link text-white fw-bold" href="index.html">Registro</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="contacto.html">Contacto</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="carrito.html">Carrito</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <section class="row justify-content-center">
            <article class="col-md-8 col-lg-6 p-4 rounded border border-secondary form-container" style="background-color: #111;">
                <h2 class="text-center text-neon mb-4">Únete a la Comunidad</h2>
                
                <form id="registroForm">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo:</label>
                        <input type="text" class="form-control" id="nombre" autocomplete="name" placeholder="Tu nombre gamer">
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico:</label>
                        <input type="email" class="form-control" id="email" autocomplete="email" placeholder="ejemplo@duocuc.cl">
                    </div>
                    
                    <div class="mb-3">
                        <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento:</label>
                        <input type="date" class="form-control" id="fechaNacimiento">
                    </div>

                    <div class="mb-3">
                        <label for="referido" class="form-label">Código de Referido (Opcional):</label>
                        <input type="text" class="form-control" id="referido" placeholder="Ingresa código para Puntos LevelUp">
                    </div>

                    <div id="mensajeApp" class="mb-3 fw-bold"></div>

                    <button type="submit" class="btn btn-neon w-100 py-2">Registrarme y Subir de Nivel</button>
                </form>
            </article>
        </section>
    </main>

    
    <footer class="text-center py-4 mt-auto" style="background-color: #000000; border-top: 1px solid #333;">
        <div class="container">
            <p class="mb-1">Equipo de Desarrollo Fullstack II - 2024</p>
            <p class="text-muted small">Apoyando a la comunidad gamer nacional.</p>
            <a href="https://wa.me/56912345678" target="_blank" class="btn btn-outline-success rounded-pill mt-2" style="border-color: #39FF14; color: #39FF14;">Chat de Soporte Técnico</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
</body>
</html>
