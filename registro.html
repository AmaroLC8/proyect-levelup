    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1E90FF;">

            <li class="nav-item"><a class="nav-link text-white" href="carrito.html">🛒 Carrito</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <section class="row justify-content-center">
      <article class="col-md-10 col-lg-8 p-4 rounded border border-secondary form-container" style="background-color: #111111;">
        <h2 class="text-center text-neon mb-4">Únete a la Comunidad Gamer</h2>
        <form id="registroForm">
          
          <div class="row g-3">
            <!-- RUN -->
            <div class="col-md-6">
              <label for="run" class="form-label">RUN (sin puntos ni guion):</label>
              <input type="text" class="form-control" id="run" placeholder="Ej: 19011022K" maxlength="9" required>
              <small class="text-muted">Entre 7 y 9 caracteres.</small>
            </div>

            <!-- Nombre -->
            <div class="col-md-6">
              <label for="nombre" class="form-label">Nombre:</label>
              <input type="text" class="form-control" id="nombre" autocomplete="given-name" placeholder="Tu nombre" maxlength="50" required>
            </div>

            <!-- Apellidos -->
            <div class="col-md-6">
              <label for="apellidos" class="form-label">Apellidos:</label>
              <input type="text" class="form-control" id="apellidos" autocomplete="family-name" placeholder="Tus apellidos" maxlength="100" required>
            </div>

            <!-- Correo -->
            <div class="col-md-6">
              <label for="email" class="form-label">Correo Electrónico:</label>
              <input type="email" class="form-control" id="email" autocomplete="email" placeholder="ejemplo@duoc.cl" maxlength="100" required>
              <small class="text-muted">Solo @duoc.cl, @profesor.duoc.cl o @gmail.com</small>
            </div>

            <!-- Fecha Nacimiento -->
            <div class="col-md-6">
              <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento:</label>
              <input type="date" class="form-control" id="fechaNacimiento" required>
              <small class="text-muted">Debes ser mayor de 18 años.</small>
            </div>

            <!-- Código Referido -->
            <div class="col-md-6">
              <label for="referido" class="form-label">Código Referido (Opcional):</label>
              <input type="text" class="form-control" id="referido" placeholder="Para ganar Puntos LevelUp">
            </div>

            <!-- Región -->
            <div class="col-md-6">
              <label for="regionSelect" class="form-label">Región:</label>
              <select class="form-select form-control" id="regionSelect" required>
                <option value="">-- Selecciona Región --</option>
              </select>
            </div>

            <!-- Comuna -->
            <div class="col-md-6">
              <label for="comunaSelect" class="form-label">Comuna:</label>
              <select class="form-select form-control" id="comunaSelect" required disabled>
                <option value="">-- Selecciona Comuna --</option>
              </select>
            </div>

            <!-- Dirección -->
            <div class="col-12">
              <label for="direccion" class="form-label">Dirección de Despacho:</label>
              <input type="text" class="form-control" id="direccion" placeholder="Calle, número, depto/casa" maxlength="300" required>
            </div>
          </div>

          <button type="submit" class="btn btn-neon w-100 py-2 mt-4">Registrarme y Subir de Nivel</button>
        </form>
      </article>
    </section>
  </main>

  <footer class="text-center py-4 mt-auto" style="background-color: #000000; border-top: 1px solid #333;">

    </div>
  </footer>
